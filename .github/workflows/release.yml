name: Release
# Run by hand from the Actions tab once the version in yuuna/pubspec.yaml has
# been bumped on main. Builds a signed APK, tags the commit v<version> and
# publishes a GitHub release with the APK.
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false
permissions:
  contents: read
concurrency: release
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@v3
    - name: Read the version and check it has not been released
      id: version
      run: |
        if [ "$GITHUB_REF" != "refs/heads/main" ]; then
          echo "::error::Releases are made from main, not $GITHUB_REF."
          exit 1
        fi
        # "version: 3.0.1+204" -> "3.0.1"; the build number stays in the APK.
        version="$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' yuuna/pubspec.yaml)"
        if [ -z "$version" ]; then
          echo "::error::No version found in yuuna/pubspec.yaml."
          exit 1
        fi
        if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
          echo "::error::v$version has already been released. Bump the version in yuuna/pubspec.yaml first."
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
  build:
    needs: version
    uses: ./.github/workflows/main.yml
    with:
      release: true
    secrets: inherit
  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: jidoujisho-apk
        path: apk
    - name: Publish the release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        VERSION: ${{ needs.version.outputs.version }}
        PRERELEASE: ${{ inputs.prerelease }}
      run: |
        apk="jidoujisho-plus-$VERSION-arm64.apk"
        mv apk/app-release.apk "$apk"
        flags=()
        if [ "$PRERELEASE" = "true" ]; then
          flags+=(--prerelease)
        fi
        gh release create "v$VERSION" "$apk" \
          --target "$GITHUB_SHA" \
          --title "jidoujisho+ $VERSION" \
          --generate-notes \
          "${flags[@]}"
