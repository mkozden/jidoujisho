name: Build Android APK
on:
  push:
    branches: ['main', 'claude/**']
    paths: ['yuuna/**', '.github/workflows/main.yml']
  pull_request:
    branches: ['main']
    paths: ['yuuna/**']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-java@v2
      with:
        distribution: 'zulu'
        java-version: '11'
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.13.5'
    - run: flutter pub get
      working-directory: yuuna
    - run: flutter pub run build_runner build --delete-conflicting-outputs
      working-directory: yuuna
    - run: flutter analyze
      working-directory: yuuna
    - name: Set up release signing
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "::warning::No signing key secrets; the APK is signed with a random debug key and cannot update other builds."
          exit 0
        fi
        echo "$KEYSTORE_BASE64" | base64 -d > yuuna/android/app/release.jks
        {
          echo "storeFile=release.jks"
          echo "storePassword=$KEYSTORE_PASSWORD"
          echo "keyAlias=$KEY_ALIAS"
          echo "keyPassword=$KEY_PASSWORD"
        } > yuuna/android/key.properties
    - run: flutter build apk --target-platform=android-arm64
      working-directory: yuuna
    - uses: actions/upload-artifact@v4
      with:
        name: jidoujisho-apk
        path: yuuna/build/app/outputs/flutter-apk/*.apk
        if-no-files-found: error
