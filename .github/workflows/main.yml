name: Build Android APK
on:
  push:
    branches: ['main', 'claude/**']
    paths: ['yuuna/**', '.github/workflows/main.yml']
  pull_request:
    branches: ['main']
    paths: ['yuuna/**']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-java@v2
      with:
        distribution: 'zulu'
        java-version: '11'
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.13.5'
    - run: flutter pub get
      working-directory: yuuna
    - run: flutter pub run build_runner build --delete-conflicting-outputs
      working-directory: yuuna
    - run: flutter analyze
      working-directory: yuuna
    - name: Set up release signing
      env:
        # Base64 of a PKCS12 keystore holding the key "jidoujisho", and its
        # password (PKCS12 uses the same password for the key).
        SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      run: |
        if [ -z "$SIGNING_KEYSTORE" ] || [ -z "$SIGNING_PASSWORD" ]; then
          echo "::warning::No SIGNING_KEYSTORE/SIGNING_PASSWORD secrets; the APK is signed with a random debug key and cannot update other builds."
          exit 0
        fi
        echo "$SIGNING_KEYSTORE" | tr -d '[:space:]' | base64 -d > yuuna/android/app/release.p12
        {
          echo "storeFile=release.p12"
          echo "storePassword=$(echo "$SIGNING_PASSWORD" | tr -d '[:space:]')"
          echo "keyAlias=jidoujisho"
          echo "keyPassword=$(echo "$SIGNING_PASSWORD" | tr -d '[:space:]')"
        } > yuuna/android/key.properties
    - run: flutter build apk --target-platform=android-arm64
      working-directory: yuuna
    - name: Show the signing certificate
      run: |
        apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
        "$apksigner" verify --print-certs yuuna/build/app/outputs/flutter-apk/*.apk | grep -i "SHA-256"
    - uses: actions/upload-artifact@v4
      with:
        name: jidoujisho-apk
        path: yuuna/build/app/outputs/flutter-apk/*.apk
        if-no-files-found: error
