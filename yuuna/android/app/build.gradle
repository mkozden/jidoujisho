def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Release builds are signed with the key described in android/key.properties
// when it exists (CI writes it from repository secrets). Android only lets an
// APK update an installed app signed with the same key, so builds signed with
// a machine's random debug key cannot update each other.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

// Builds with yuunaSideBySide=true (see gradle.properties) use a different
// package name and launcher label, so they install next to the original app
// instead of replacing it.
def sideBySide = (project.findProperty('yuunaSideBySide') ?: 'false').toString().toBoolean()

android {
    compileSdkVersion 34
    ndkVersion '21.4.7075529'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "app.arianneorpilla.yuuna"
        minSdkVersion 24
        targetSdkVersion 32
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        if (sideBySide) {
            applicationIdSuffix ".plus"
        }
        manifestPlaceholders += [appLabel: sideBySide ? "jidoujisho+" : "jidoujisho"]

        // Plugins such as VLC and FFmpeg ship native libraries for every ABI.
        // Only package the ABIs Flutter builds for (--target-platform); ABI
        // splits (--split-per-abi) already filter them and conflict with this.
        def targetPlatforms = project.findProperty('target-platform')
        def splitPerAbi = (project.findProperty('split-per-abi') ?: 'false').toString().toBoolean()
        if (targetPlatforms && !splitPerAbi) {
            def platformAbis = [
                'android-arm'  : 'armeabi-v7a',
                'android-arm64': 'arm64-v8a',
                'android-x86'  : 'x86',
                'android-x64'  : 'x86_64',
            ]
            def abis = targetPlatforms.toString().split(',').collect { platformAbis[it.trim()] }.findAll { it }
            if (abis) {
                ndk {
                    abiFilters.addAll(abis)
                }
            }
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
      release {
         minifyEnabled true
         signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
      }

      debug {
        
      }
   }

    packagingOptions {
       // Fixes duplicate libraries build issue, 
       // when your project uses more than one plugin that depend on C++ libs.
        pickFirst 'lib/**/libc++_shared.so'
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def appName = sideBySide ? "jidoujisho_yuuna_plus" : "jidoujisho_yuuna"
            def buildType = variant.buildType.name
            def architecture = output.getFilter(com.android.build.OutputFile.ABI)
            def newName

            if ("${architecture}" == "arm64-v8a") {
                architecture = "arm64"
            } else if ("${architecture}" == "armeabi-v7a") {
                architecture = "armeabi"
            }

            if ("${architecture}" == "null") {
                if (buildType == 'debug') {
                    newName = "${appName}_${defaultConfig.versionName}-debug.apk"
                } else {
                    newName = "${appName}_${defaultConfig.versionName}.apk"
                }
                
                output.versionCodeOverride = (100 * project.android.defaultConfig.versionCode)
            } else {
                if (buildType == 'debug') {
                    newName = "${appName}_${defaultConfig.versionName}-${architecture}-debug.apk"
                } else {
                    newName = "${appName}_${defaultConfig.versionName}-${architecture}.apk"
                }

                def offset
                if (architecture == "armeabi") {
                    offset = 1
                } else if (architecture == "arm64") {
                    offset = 2
                } else if (architecture == "x86_64") {
                    offset = 3
                }

                outputFileName = newName
                output.versionCodeOverride = (100 * project.android.defaultConfig.versionCode) + offset
            }
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation 'com.github.ankidroid:Anki-Android:2.17alpha14'
    implementation 'com.github.umair13adil:RxLogs:v1.0.18'
}
